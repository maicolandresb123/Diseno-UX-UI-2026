<!-- Indica al navegador que el documento utiliza HTML5 -->
<!DOCTYPE html>

<!-- Inicio del documento HTML. lang="es" indica que el idioma es español -->
<html lang="es">

<!-- Inicio de la cabecera del documento -->
<head>

    <!-- Define la codificación UTF-8 para mostrar correctamente tildes, ñ y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Define el título que aparece en la pestaña del navegador -->
    <title>Ejercicio 01</title>

<!-- Fin de la cabecera del documento -->
</head>

<!-- Inicio del contenido visible de la página -->
<body>

    <!-- Encabezado principal de la página -->
    <h1>Ejercicio 01</h1>

    <!-- Párrafo de texto -->
    <p>Esta es mi primera página creada con HTML.</p>

    <!--
        Inserta una imagen.
        src indica la ubicación del archivo.
        alt proporciona una descripción alternativa para accesibilidad.
    -->
    <img src="https://es.digitaltrends.com/computadoras/mejores-computadoras-de-escritorio/"
         alt="Computadora portátil sobre un escritorio">

<!-- Fin del contenido visible de la página -->
</body>

<!-- Fin del documento HTML -->
</html>
