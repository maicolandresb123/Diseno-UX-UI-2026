<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Uxui — Electric Flow</title><desc id="desc">Wireframe desktop transformado en una interfaz de teléfono responsive</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101C37"/><stop offset="1" stop-color="#171136"/></linearGradient><linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow"><stop stop-color="#2563EB" stop-opacity=".3"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity=".075" stroke-width="1" fill="none"/></pattern><style><![CDATA[.flow{stroke-dasharray:12 10;animation:dash 7s linear infinite} .shimmer{animation:glow 3s ease-in-out infinite alternate} .blink{animation:blink 3s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-264}}@keyframes glow{to{opacity:.5}}@keyframes blink{0%,100%{opacity:.32}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.shimmer,.blink{animation:none!important}}]]></style></defs><rect width="900" height="320" rx="24" fill="url(#bg)"/><rect width="900" height="320" rx="24" fill="url(#grid)"/><circle cx="760" cy="90" r="260" fill="url(#glow)"/><path d="M0 286H900" stroke="#38BDF8" stroke-opacity=".19"/><text x="34" y="38" fill="#93C5FD" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">06 / UX &amp; FRONTEND</text><circle class="blink" cx="851" cy="32" r="6" fill="#38BDF8"/><rect x="51" y="85" width="424" height="170" rx="13" fill="#0B1933" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="2"/><rect x="51" y="85" width="424" height="32" rx="13" fill="#1C3156"/><circle cx="70" cy="101" r="4" fill="#38BDF8"/><circle cx="85" cy="101" r="4" fill="#8B5CF6"/><text x="89" y="145" font-family="sans-serif" font-size="16" fill="#E2E8F0" font-weight="600">WIREFRAME  /  DESKTOP</text><rect x="87" y="171" width="157" height="54" rx="7" fill="#223B61"/><rect x="257" y="171" width="89" height="54" rx="7" fill="#33456B"/><rect x="358" y="171" width="83" height="54" rx="7" fill="#33456B"/><path class="flow" d="M485 165H591" stroke="url(#beam)" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="614" y="78" width="201" height="192" rx="13" fill="#0B1933" stroke="#38BDF8" stroke-opacity=".6" stroke-width="2"/><rect x="614" y="78" width="201" height="32" rx="13" fill="#1C3156"/><circle cx="633" cy="94" r="4" fill="#38BDF8"/><circle cx="648" cy="94" r="4" fill="#8B5CF6"/><text x="650" y="130" font-family="sans-serif" font-size="17" fill="#E2E8F0" font-weight="600">MOBILE UI</text><rect x="651" y="147" width="131" height="49" rx="7" fill="#264B79"/><rect x="651" y="207" width="131" height="20" rx="6" fill="#8B5CF6"/><text x="34" y="295" fill="#A7B8D5" font-size="14" font-family="sans-serif" letter-spacing="1">RESEARCH / DESIGN / IMPLEMENT</text></svg>