<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Industria — Electric Flow</title><desc id="desc">Sensor industrial conectado a PLC e interfaz de supervisión</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101C37"/><stop offset="1" stop-color="#171136"/></linearGradient><linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow"><stop stop-color="#2563EB" stop-opacity=".3"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity=".075" stroke-width="1" fill="none"/></pattern><style><![CDATA[.flow{stroke-dasharray:12 10;animation:dash 7s linear infinite} .shimmer{animation:glow 3s ease-in-out infinite alternate} .blink{animation:blink 3s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-264}}@keyframes glow{to{opacity:.5}}@keyframes blink{0%,100%{opacity:.32}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.shimmer,.blink{animation:none!important}}]]></style></defs><rect width="900" height="320" rx="24" fill="url(#bg)"/><rect width="900" height="320" rx="24" fill="url(#grid)"/><circle cx="760" cy="90" r="260" fill="url(#glow)"/><path d="M0 286H900" stroke="#38BDF8" stroke-opacity=".19"/><text x="34" y="38" fill="#93C5FD" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">02 / INDUSTRY 4.0</text><circle class="blink" cx="851" cy="32" r="6" fill="#38BDF8"/><rect x="39" y="91" width="183" height="152" rx="13" fill="#0B1933" stroke="#7C9CEE" stroke-opacity=".6" stroke-width="2"/><rect x="39" y="91" width="183" height="32" rx="13" fill="#1C3156"/><circle cx="58" cy="107" r="4" fill="#38BDF8"/><circle cx="73" c