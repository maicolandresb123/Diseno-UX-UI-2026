<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Software — Electric Flow</title><desc id="desc">APIs, ERP y bases de datos unidos por integraciones</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101C37"/><stop offset="1" stop-color="#171136"/></linearGradient><linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow"><stop stop-color="#2563EB" stop-opacity=".3"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity=".075" stroke-width="1" fill="none"/></pattern><style><![CDATA[.flow{stroke-dasharray:12 10;animation:dash 7s linear infinite} .shimmer{animation:glow 3s ease-in-out infinite alternate} .blink{animation:blink 3s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-264}}@keyframes glow{to{opacity:.5}}@keyframes blink{0%,100%{opacity:.32}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.shimmer,.blink{animation:none!important}}]]></style></defs><rect width="900" height="320" rx="24" fill="url(#bg)"/><rect width="900" height="320" rx="24" fill="url(#grid)"/><circle cx="760" cy="90" r="260" fill="url(#glow)"/><path d="M0 286H900" stroke="#38BDF8" stroke-opacity=".19"/><text x="34" y="38" fill="#93C5FD" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">01 / SOFTWARE</text><circle class="blink" cx="851" cy="32" r="6" fill="#38BDF8"/><rect x="38" y="88" width="226" height="151" rx="13" fill="#0B1933" stroke="#7C9CEE" stroke-opacity=".6" stroke-width="2"/><rect x="38" y="88" width="226" height="32" rx="13" fill="#1C3156"/><circle cx="57" cy="104" r="4" fill="#38BDF8"/><circle cx="72" cy="104" r="4" fill="#8B5CF6"/><text x="61" y="155" font-family="sans-serif" font-size="29" fill="#38BDF8" font-weight="600">{ API }</text><text x="61" y="190" font-family="sans-serif" font-size="14" fill="#AFBEE1" font-weight="600">REST / WEBHOOKS</text><path class="flow" d="M280 160H377" stroke="url(#beam)" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="381" y="107" width="168" height="118" rx="13" fill="#0B1933" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="2"/><rect x="381" y="107" width="168" height="32" rx="13" fill="#1C3156"/><circle cx="400" cy="123" r="4" fill="#38BDF8"/><circle cx="415" cy="123" r="4" fill="#8B5CF6"/><text x="416" y="172" font-family="sans-serif" font-size="20" fill="#C4B5FD" font-weight="600">SQL / ERP</text><path class="flow" d="M560 160H662" stroke="url(#beam)" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="665" y="101" width="190" height="129" rx="13" fill="#0B1933" stroke="#38BDF8" stroke-opacity=".6" stroke-width="2"/><rect x="665" y="101" width="190" height="32" rx="13" fill="#1C3156"/><circle cx="684" cy="117" r="4" fill="#38BDF8"/><circle cx="699" cy="117" r="4" fill="#8B5CF6"/><text x="699" y="175" font-family="sans-serif" font-size="17" fill="#E2E8F0" font-weight="600">AUTOMATION</text><text x="34" y="295" fill="#A7B8D5" font-size="14" font-family="sans-serif" letter-spacing="1">INTEGRATION PIPELINE</text></svg>