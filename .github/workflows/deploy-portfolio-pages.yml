name: Publicar portfolio MB en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Trabajo-Final-Portfolio/**"
      - ".github/workflows/deploy-portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Desplegar portfolio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Verificar carpeta y archivo de inicio
        run: test -f Trabajo-Final-Portfolio/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./Trabajo-Final-Portfolio

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
